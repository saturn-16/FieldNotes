<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e26"/>
      <stop offset="100%" stop-color="#0c2517"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#2e6d47" stroke-width="1.5" fill="none"/>

  <!-- Morning sun in upper corner -->
  <circle cx="47" cy="18" r="9" fill="url(#sunGrad)" opacity="0.95"/>

  <!-- Naturalist branch / twig -->
  <path d="M 8 47 Q 28 45 54 44" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Leaf sprouting from branch -->
  <path d="M 45 44 Q 52 38 48 34 Q 42 40 45 44 Z" fill="#4ade80"/>

  <!-- Bird Body -->
  <path d="M 18 36 C 18 24 28 18 38 20 C 44 21 47 25 47 31 C 47 38 41 43 32 44 C 23 44 18 41 18 36 Z" fill="#fdfbf7"/>

  <!-- Bird Beak -->
  <polygon points="46,23 57,26 46,29" fill="#f59e0b"/>

  <!-- Bird Eye -->
  <circle cx="41" cy="24" r="2.2" fill="#143e26"/>
  <circle cx="41.7" cy="23.3" r="0.7" fill="#ffffff"/>

  <!-- Bird Wing -->
  <path d="M 22 36 C 26 29 33 28 38 32 C 34 38 28 41 22 36 Z" fill="url(#wingGrad)"/>

  <!-- Bird Tail Feathers -->
  <polygon points="18,34 8,38 13,33 7,33 18,30" fill="#143e26"/>
</svg>
